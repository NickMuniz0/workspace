<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Editar Pessoa</title>
    <meta charset="UTF-8" />

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />

    <!-- Estilo personalizado -->
    <link rel="stylesheet" th:href="@{/css/pessoaEditar2.css}" />

    <!-- Font Awesome -->
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>

<!-- Menu de navegação -->
<nav th:replace="~{fragments/menu :: menu}"></nav>


<main class="container py-5">
    <div class="card shadow border-0 rounded-4">

        <!-- 🔷 Cabeçalho -->
        <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center rounded-top-4">
            <h2 class="mb-0">
                <i class="bi bi-people-fill me-2"></i>
                Pessoa: <span class="fw-bold" th:text="${pessoa.nome}"></span>
            </h2>
            <a th:href="@{/pessoas}" class="btn btn-outline-light btn-sm">
                <i class="bi bi-arrow-left"></i> Voltar
            </a>
        </div>

        <div class="card-body">
            <form th:action="@{/pessoas/salvarPessoa}" th:object="${pessoa}" method="post">
                <input type="hidden" th:field="*{id}" />

                <!-- 👤 Dados Pessoais -->
                <div class="mb-3">
                    <label for="nome" class="form-label">Nome da Pessoa</label>
                    <input type="text" th:field="*{nome}" id="nome" class="form-control" placeholder="Nome completo" />
                    <div class="text-danger" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="cpf" class="form-label">CPF</label>
                        <input type="text" th:field="*{cpf}" id="cpf" class="form-control" placeholder="CPF" />
                        <div class="text-danger" th:if="${#fields.hasErrors('cpf')}" th:errors="*{cpf}"></div>
                    </div>
                    <div class="col-md-6">
                        <label for="rg" class="form-label">RG</label>
                        <input type="text" th:field="*{rg}" id="rg" class="form-control" placeholder="RG" />
                        <div class="text-danger" th:if="${#fields.hasErrors('rg')}" th:errors="*{rg}"></div>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="dataNascimento" class="form-label">Data de Nascimento</label>
                        <input type="date" id="dataNascimento" class="form-control" th:field="*{dataNascimentoFormatada}" />
                        <div class="text-danger" th:if="${#fields.hasErrors('dataNascimento')}" th:errors="*{dataNascimento}"></div>
                    </div>
                    <div class="col-md-3 d-flex align-items-center">
                        <div class="form-check mt-4">
                            <input class="form-check-input" type="checkbox" th:field="*{avaliacaoMedica}" id="avaliacaoMedica" />
                            <label class="form-check-label" for="avaliacaoMedica">Avaliação Médica</label>
                        </div>
                    </div>
                </div>

                <!-- 🩺 Doenças -->
                <fieldset class="mb-4">
                    <legend>➕ Adicionar Doenças</legend>
                    <input type="text" class="form-control mb-2" id="buscaDoenca" placeholder="Buscar doença..." onkeyup="filtrarTabela('buscaDoenca', 'tabelaDoenca')">
                    <div class="scrollable-table">
                        <table class="table table-striped table-hover align-middle mb-0" id="tabelaDoenca">
                            <thead class="table-light">
                            <tr>
                                <th>Selecionar</th>
                                <th>Nome</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="doenca : ${doencasDisponiveis}">
                                <td><input type="checkbox" th:value="${doenca.id}" th:field="*{doencasIds}" /></td>
                                <td th:text="${doenca.nome}"></td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(doencasDisponiveis)}">
                                <td colspan="2" class="text-center text-muted">Nenhuma doença disponível</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </fieldset>

                <!-- 🧑‍🤝‍🧑 Equipes -->
                <fieldset class="mb-4">
                    <legend>➕ Adicionar Equipes</legend>
                    <input type="text" class="form-control mb-2" id="buscaEquipe" placeholder="Buscar equipe..." onkeyup="filtrarTabela('buscaEquipe', 'tabelaEquipe')">
                    <div class="scrollable-table">
                        <table class="table table-striped table-hover align-middle mb-0" id="tabelaEquipe">
                            <thead class="table-light">
                            <tr>
                                <th>Selecionar</th>
                                <th>Nome</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="equipe : ${equipesDisponiveis}">
                                <td><input type="checkbox" th:value="${equipe.id}" th:field="*{equipesIds}" /></td>
                                <td th:text="${equipe.nome}"></td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(equipesDisponiveis)}">
                                <td colspan="2" class="text-center text-muted">Nenhuma equipe disponível</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </fieldset>

                <!-- ✅ Botão de envio -->
                <div class="text-end">
                    <button type="submit" class="btn btn-success">
                        <i class="fas fa-save me-1"></i> Salvar Pessoa
                    </button>
                </div>
            </form>
        </div>
    </div>
</main>

<!-- 🔍 Script de busca -->
<script>
    function filtrarTabela(inputId, tabelaId) {
        const filtro = document.getElementById(inputId).value.toLowerCase();
        const linhas = document.querySelectorAll(`#${tabelaId} tbody tr`);
        linhas.forEach(linha => {
            const texto = linha.textContent.toLowerCase();
            linha.style.display = texto.includes(filtro) ? '' : 'none';
        });
    }
</script>
<script>
    document.getElementById('cpf').addEventListener('input', function(e) {

        let x = e.target.value.replace(/\D/g, '').match(/(\d{0,2})(\d{0,3})(\d{0,3})(\d{0,4})(\d{0,2})/);
        e.target.value = !x[2] ? x[1] : x[1] + '.' + x[2] + (x[3] ? '.' : '') + x[3] + (x[4] ? '/' : x[4]) + x[4] + (x[5] ? '-' + x[5] : '');

        if(e.target.value.length < 15) {
            x = e.target.value.replace(/\D/g, '').match(/(\d{0,3})(\d{0,3})(\d{0,3})(\d{0,2})/);
            e.target.value = !x[2] ? x[1] : x[1] + '.' + x[2] + (x[3] ? '.' : '') + x[3] + (x[4] ? '-' + x[4] : '');
        }

        console.log('Com formatação: ' + e.target.value);

        //Caso queira pegar apenas os números use essa função para remover todos os caracteres menos os números em Javascript
        let valor = e.target.value.replace(/[^0-9]/g, '');
        console.log('Sem formatação: ' + valor);
    });
</script>
</body>
</html>
