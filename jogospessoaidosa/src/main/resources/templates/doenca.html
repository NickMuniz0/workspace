<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Lista de Doenças</title>
    <meta charset="UTF-8"/>
    <link rel="stylesheet" th:href="@{/css/doenca.css}" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<nav th:replace="~{fragments/menu :: menu}"></nav>

<main class="container mt-5">
    <div class="card shadow">
        <!-- Cabeçalho -->
        <div class="card-header bg-danger text-white d-flex justify-content-between align-items-center">
            <h2 class="mb-0"><i class="fas fa-virus"></i> Lista de Doenças</h2>
            <div class="d-flex gap-2">
                <a th:href="@{/doencas/cadastrar2}" class="btn btn-light">
                    <i class="fas fa-plus-circle"></i> Nova Doença
                </a>
            </div>
        </div>

        <div class="card-body">
            <!-- Formulário de busca -->
            <form th:action="@{/doencas/buscar}" method="get" class="mb-4">
                <div class="input-group">
                    <input type="text" name="filtro" class="form-control" placeholder="Buscar por nome da doença..." th:value="${filtro}">
                    <button type="submit" class="btn btn-outline-danger">
                        <i class="fas fa-search"></i> Buscar
                    </button>
                </div>
            </form>

            <!-- Formulário de exclusão múltipla -->
            <form th:action="@{/doencas/deletarMultiplos}" method="post" id="formDoencas">
                <div class="table-responsive-scroll">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                        <tr>
                            <th><input type="checkbox" onclick="toggleAll(this)" /></th>
                            <th>Nome</th>
                            <th>Ações</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="doenca : ${doencas}">
                            <td><input type="checkbox" name="idsParaExcluir" th:value="${doenca.id}" class="checkExcluir" /></td>
                            <td th:text="${doenca.nome}"></td>
                            <td>
                                <a th:href="@{/doencas/edit2/{id}(id=${doenca.id})}" class="btn btn-outline-primary btn-sm me-2">
                                    <i class="fas fa-edit"></i> Editar
                                </a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(doencas)}">
                            <td colspan="4" class="text-center text-muted">Nenhuma doença encontrada</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
                <!-- ✅ Botão de exclusão -->
                <div class="text-end">
                    <button type="submit" class="btn btn-danger" id="btnExcluir" disabled onclick="return confirmarExclusao()">
                        <i class="fas fa-trash"></i> Excluir Selecionados
                    </button>
                </div>
            </form>
        </div>
    </div>
</main>

<!-- 🧠 Scripts -->
<script>
    function toggleAll(source) {
        const checkboxes = document.querySelectorAll('.checkExcluir');
        checkboxes.forEach(cb => cb.checked = source.checked);
        atualizarBotao();
    }

    function atualizarBotao() {
        const selecionados = document.querySelectorAll('.checkExcluir:checked');
        document.getElementById('btnExcluir').disabled = selecionados.length === 0;
    }

    document.querySelectorAll('.checkExcluir').forEach(cb => {
        cb.addEventListener('change', atualizarBotao);
    });

    function confirmarExclusao() {
        return confirm("Tem certeza que deseja excluir as pessoas selecionadas?");
    }
</script>
</body>
</html>
