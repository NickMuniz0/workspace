<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Lista de Pessoas</title>
    <meta charset="UTF-8"/>
    <!-- Estilos -->
    <link rel="stylesheet" th:href="@{/css/pessoa.css}" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- Menu -->
<nav th:replace="~{fragments/menu :: menu}"></nav>

<main class="container mt-5">
    <div class="card shadow">
        <!-- 🔷 Cabeçalho -->
        <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
            <h2 class="mb-0"><i class="fas fa-users"></i> Lista de Pessoas</h2>
            <div class="d-flex gap-2">
                <a th:href="@{/pessoas/cadastrar2}" class="btn btn-light">
                    <i class="fas fa-user-plus"></i> Nova Pessoa
                </a>
            </div>
        </div>

        <div class="card-body">
            <!-- 🔍 Formulário de busca -->
            <form th:action="@{/pessoas/buscar}" method="get" class="mb-4">
                <div class="input-group">
                    <input type="text" name="filtro" class="form-control" placeholder="Buscar por nome, CPF ou RG..." th:value="${filtro}">
                    <button type="submit" class="btn btn-outline-primary">
                        <i class="fas fa-search"></i> Buscar
                    </button>
                </div>
            </form>

            <!-- 🗑️ Formulário de exclusão múltipla -->
            <form th:action="@{/pessoas/deletarMultiplos}" method="post" id="formPessoas">


                <div class="table-responsive mb-3">
                    <table class="table table-bordered table-hover align-middle">
                        <thead class="table-light">
                        <tr>
                            <th><input type="checkbox" onclick="toggleAll(this)" /></th>
                            <th>Nome</th>
                            <th>Idade</th>
                            <th>RG</th>
                            <th>CPF</th>
                            <th>Idoso</th>
                            <th>Avaliação Médica</th>
                            <th>Doenças</th>
                            <th>Equipes</th>
                            <th>Ações</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="pessoa : ${pessoas}">
                            <td><input type="checkbox" name="idsParaExcluir" th:value="${pessoa.id}" class="checkExcluir" /></td>
                            <td th:text="${pessoa.nome}"></td>
                            <td th:text="${pessoa.idade}"></td>
                            <td th:text="${pessoa.rg}"></td>
                            <td th:text="${pessoa.cpf}"></td>
                            <td th:text="${pessoa.idoso ? 'Sim' : 'Não'}"></td>
                            <td th:text="${pessoa.avaliacaoMedica ? 'Sim' : 'Não'}"></td>
                            <td>
                                <ul class="list-group">
                                    <li class="list-group-item" th:each="doenca : ${pessoa.doencas}" th:text="${doenca.nome}"></li>
                                </ul>
                            </td>
                            <td>
                                <ul class="list-group">
                                    <li class="list-group-item" th:each="equipe : ${pessoa.equipes}" th:text="${equipe.nome}"></li>
                                </ul>
                            </td>
                            <td>
                                <a th:href="@{/pessoas/edit2/{id}(id=${pessoa.id})}" class="btn btn-outline-primary btn-sm me-2">
                                    <i class="fas fa-edit"></i> Editar
                                </a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(pessoas)}">
                            <td colspan="11" class="text-center text-muted">Nenhuma pessoa encontrada</td>
                        </tr>
                        </tbody>
                    </table>
                </div>

                <!-- ✅ Botão de exclusão -->
                <div class="text-end">
                    <button type="submit" class="btn btn-danger" id="btnExcluir" disabled onclick="return confirmarExclusao()">
                        <i class="fas fa-trash"></i> Excluir Selecionados
                    </button>
                </div>
            </form>
        </div>
    </div>
</main>

<!-- 🧠 Scripts -->
<script>
    function toggleAll(source) {
        const checkboxes = document.querySelectorAll('.checkExcluir');
        checkboxes.forEach(cb => cb.checked = source.checked);
        atualizarBotao();
    }

    function atualizarBotao() {
        const selecionados = document.querySelectorAll('.checkExcluir:checked');
        document.getElementById('btnExcluir').disabled = selecionados.length === 0;
    }

    document.querySelectorAll('.checkExcluir').forEach(cb => {
        cb.addEventListener('change', atualizarBotao);
    });

    function confirmarExclusao() {
        return confirm("Tem certeza que deseja excluir as pessoas selecionadas?");
    }
</script>

</body>
</html>
