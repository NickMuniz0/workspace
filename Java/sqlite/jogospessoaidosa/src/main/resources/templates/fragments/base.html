<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
</head>
<body>

    <head th:fragment="head(title, cssFile)">
        <meta charset="UTF-8"/>
        <title th:text="${title}">Sistema</title>

        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"/>

        <link th:if="${cssFile != null and !#strings.isEmpty(cssFile)}"
              rel="stylesheet"
              th:href="@{${cssFile}}"/>
    </head>

    <script th:fragment="bootstrapScripts"
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script th:fragment="bulkActionsScript">
        document.addEventListener('DOMContentLoaded', function () {
            const formBusca = document.getElementById('formBusca');
            if (formBusca) {
                formBusca.addEventListener('submit', function (event) {
                    const filtroInput = this.querySelector('input[name="filtro"]');
                    if (!filtroInput || !filtroInput.value.trim()) return;

                    const pageInput = this.querySelector('input[name="page"]');
                    if (!pageInput) {
                        const hidden = document.createElement('input');
                        hidden.type = 'hidden';
                        hidden.name = 'page';
                        hidden.value = '0';
                        this.appendChild(hidden);
                    }
                });
            }

            const globalToggle = document.querySelector('input[onclick*="toggleAll(this)"]');
            if (globalToggle) {
                globalToggle.addEventListener('click', function () {
                    const checkboxes = document.querySelectorAll('.checkExcluir');
                    checkboxes.forEach(cb => cb.checked = globalToggle.checked);
                    atualizarBotaoExcluir();
                });
            }

            const checkboxes = document.querySelectorAll('.checkExcluir');
            checkboxes.forEach(cb => {
                cb.addEventListener('change', atualizarBotaoExcluir);
            });

            function atualizarBotaoExcluir() {
                const selecionados = document.querySelectorAll('.checkExcluir:checked');
                const btnExcluir = document.getElementById('btnExcluir');
                if (btnExcluir) {
                    btnExcluir.disabled = selecionados.length === 0;
                }
            }

            const btnExcluir = document.getElementById('btnExcluir');
            if (btnExcluir) {
                btnExcluir.addEventListener('click', function (event) {
                    if (!confirm('Tem certeza que deseja excluir os itens selecionados?')) {
                        event.preventDefault();
                    }
                });
            }
        });
    </script>

</body>
</html>
