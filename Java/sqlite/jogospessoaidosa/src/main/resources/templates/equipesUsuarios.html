<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Gerenciar Usuários da Equipe</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Estilos -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/equipeUsuarios.css}" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">


</head>
<body class="bg-light">

<!-- Menu -->
<nav th:replace="~{fragments/menu :: menu}"></nav>
<main class="container py-5">
    <div class="card shadow border-0 rounded-4">
        <!-- 🟢 Cabeçalho -->
        <div class="card-header bg-info text-white d-flex justify-content-between align-items-center rounded-top-4">
            <h2 class="mb-0">
                <i class="fas fa-users me-2"></i> Equipe <span class="fw-bold" th:text="${equipe.nome}"></span>

            </h2>
            <a th:href="@{/equipes}" class="btn btn-outline-light btn-sm">
                <i class="bi bi-arrow-left"></i> Voltar
            </a>
        </div>
        <!-- 🔍 Campo de busca estilizado -->
        <div class="input-group mb-3">
        <span class="input-group-text bg-white border-end-0">
            <i class="bi bi-search"></i>
        </span>
            <input type="text" name="buscaParticipantes" class="form-control border-start-0" placeholder="Buscar participantes disponíveis..." />
        </div>

        <div class="card-body">
            <!-- Seção de Tabelas -->
            <section class="row g-4">
                <!-- 👥 Usuários na Equipe -->
                <div class="col-md-6">
                    <h5 class="mb-3">👥 Usuários na Equipe</h5>

                    <!-- 📋 Tabela com rolagem -->
                    <div class="scrollable-table mb-3">
                        <table class="table table-striped table-hover align-middle mb-0">
                            <thead class="table-light">
                            <tr>
                                <th>Remover</th>
                                <th>Nome</th>
                                <th>Idade</th>
                                <th>Idoso</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="pessoa : ${pessoasNaEquipe}">
                                <td><input type="checkbox" name="pessoaIds" form="pessoasEquipe" th:value="${pessoa.id}" /></td>
                                <td th:text="${pessoa.nome}"></td>
                                <td th:text="${pessoa.idade}"></td>
                                <td th:text="${pessoa.idoso ? 'Sim' : 'Não'}"></td>

                            </tr>
                            <tr th:if="${#lists.isEmpty(pessoasNaEquipe)}">
                                <td colspan="5" class="text-center text-muted">Nenhum usuário na equipe</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>

                    <!-- 🧭 Ações -->
                    <div class="d-flex justify-content-between">
                        <form th:action="@{/equipes/usuarios/adicionarUsuariosParticipantes}" method="post"  >
                            <input type="hidden" name="equipeId" th:value="${equipe.id}" />
                            <button type="submit" class="btn btn-success">
                                <i class="bi bi-arrow-down"></i>                 </button>
                        </form>
                        <form th:action="@{/equipes/usuarios/removerUsuariosEquipe}" method="post"  id="pessoasEquipe">
                            <input type="hidden" name="equipeId" th:value="${equipe.id}" />
                            <button type="submit" class="btn btn-danger">
                                <i class="bi bi-trash-fill"></i>                              </button>
                        </form>

                        <form th:action="@{/equipes/usuarios/gerarPdfTodasAsPessoasDaEquipe/{id}(id=${equipe.id})}" method="get" target="_blank">
                            <button type="submit" class="btn btn-outline-secondary">
                                <i class="bi bi-file-earmark-pdf-fill"></i> TODOS
                            </button>
                        </form>
                        <form th:action="@{/equipes/usuarios/gerarPdfTodasAsPessoasDaEquipeIdosos/{id}(id=${equipe.id})}" method="get" target="_blank">
                            <button type="submit" class="btn btn-outline-secondary">
                                <i class="bi bi-file-earmark-pdf-fill"></i> IDOSOS
                            </button>
                        </form>
                    </div>
                </div>

                <!-- ➕ Adicionar Novos Usuários -->
                <div class="col-md-6">
                    <h5 class="mb-3">➕ Adicionar Novos Usuários</h5>

                    <!-- 📋 Tabela com rolagem -->
                    <div class="scrollable-table mb-3">
                        <form th:action="@{/equipes/usuarios/adicionarUsuariosEquipe}" method="post" id="pessoasDisponiveis">
                            <input type="hidden" name="equipeId" th:value="${equipe.id}" />
                            <table class="table table-striped table-hover align-middle mb-0">
                                <thead class="table-light">
                                <tr>
                                    <th>Selecionar</th>
                                    <th>Nome</th>
                                    <th>Idade</th>
                                    <th>Idoso</th>

                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="pessoa : ${pessoasDisponiveis}">
                                    <td><input type="checkbox" name="pessoaIds" th:value="${pessoa.id}" /></td>
                                    <td th:text="${pessoa.nome}"></td>
                                    <td th:text="${pessoa.idade}"></td>
                                    <td th:text="${pessoa.idoso ? 'Sim' : 'Não'}"></td>

                                </tr>
                                <tr class="no-results" th:if="${#lists.isEmpty(pessoasDisponiveis)}">
                                    <td colspan="3" class="text-center text-muted">Nenhuma pessoa disponível para adicionar</td>
                                </tr>
                                </tbody>
                            </table>
                        </form>
                    </div>

                    <!-- 🧭 Ações -->
                    <div class="d-flex justify-content-between">
                        <button type="submit" form="pessoasDisponiveis" class="btn btn-success">
                            <i class="bi bi-arrow-left"></i>
                        </button>
                    </div>
                </div>

                <!-- ➕ Adicionar Participantes -->
                <div class="col-md-12">
                    <h5 class="mb-3">➕ Adicionar Participantes</h5>

                      <!-- 📋 Tabela com rolagem -->
                    <div class="scrollable-table mb-3">
                        <table class="table table-striped table-hover align-middle mb-0">
                            <thead class="table-light">
                            <tr>
                                <th>Remover</th>
                                <th>Nome</th>
                                <th>Idade</th>
                                <th>Idoso</th>

                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="pessoa : ${pessoasParticipantes}">
                                <td><input type="checkbox" name="pessoaIds" form="pessoasParticipantes" th:value="${pessoa.id}" /></td>
                                <td th:text="${pessoa.nome}"></td>
                                <td th:text="${pessoa.idade}"></td>
                                <td th:text="${pessoa.idoso ? 'Sim' : 'Não'}"></td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(pessoasParticipantes)}">
                                <td colspan="5" class="text-center text-muted">Nenhum usuário na equipe</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>

                    <!-- 🧭 Ações -->
                    <div class="d-flex justify-content-between">
                        <form th:action="@{/equipes/usuarios/removerUsuariosParticipantes}" method="post" id="pessoasParticipantes">
                            <input type="hidden" name="equipeId" th:value="${equipe.id}" />
                            <button type="submit" class="btn btn-danger">
                                <i class="bi bi-trash-fill"></i>                       </button>
                        </form>

                        <form th:action="@{/equipes/usuarios/gerarPdfTodasAsPessoasParticipantes/{id}(id=${equipe.id})}" method="get" target="_blank">
                            <button type="submit" class="btn btn-outline-secondary">
                                <i class="bi bi-file-earmark-pdf-fill"></i> TODOS
                            </button>
                        </form>

                        <form th:action="@{/equipes/usuarios/gerarPdfTodasAsPessoasParticipantesIdosos/{id}(id=${equipe.id})}" method="get" target="_blank">
                            <button type="submit" class="btn btn-outline-secondary">
                                <i class="bi bi-file-earmark-pdf-fill"></i> IDOSOS
                            </button>
                        </form>
                    </div>
                </div>


            </section>

            <!-- Formulário da Equipe -->
            <form th:action="@{/equipes/salvarEquipe}" th:object="${equipe}" method="post">
                <!-- Nome da Equipe -->
                <div class="mb-3">
                    <input type="hidden" th:field="*{id}" />
                    <label for="nome" class="form-label">Nome da Equipe</label>
                    <input type="text" th:field="*{nome}" id="nome" class="form-control" placeholder="Nome da equipe" />
                    <div class="text-danger" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></div>
                </div>

                <!-- RPA -->
                <div class="mb-3">
                    <label for="rpa" class="form-label">RPA</label>
                    <select th:field="*{rpa}" id="rpa" class="form-select">
                        <option value="" disabled selected>Selecione a RPA</option>
                        <option th:each="rpaItem : ${RPA}"
                                th:value="${rpaItem}"
                                th:text="${rpaItem}">RPA</option>
                    </select>
                    <div class="text-danger" th:if="${#fields.hasErrors('rpa')}" th:errors="*{rpa}"></div>
                </div>

                <!-- Representantes -->
                <fieldset class="mb-4">
                    <legend>Representantes</legend>
                    <div id="representantes-container">
                        <div th:each="rep, repStat : *{representantes}" class="representante-block border p-3 mb-3 rounded">
                            <label class="form-label">Nome do Representante</label>
                            <input type="text" th:field="*{representantes[__${repStat.index}__].nome}" class="form-control mb-2" />

                            <div class="telefones-container">
                                <label class="form-label">Telefones</label>
                                <div th:each="tel, telStat : *{representantes[__${repStat.index}__].telefones}" class="telefone-block mb-2">
                                    <div class="row g-2">
                                        <div class="col-md-3">
                                            <input type="text" th:field="*{representantes[__${repStat.index}__].telefones[__${telStat.index}__].dd}" class="form-control" placeholder="DDD" />
                                        </div>
                                        <div class="col-md-7">
                                            <input type="text" th:field="*{representantes[__${repStat.index}__].telefones[__${telStat.index}__].numero}" class="form-control" placeholder="Número" />
                                        </div>
                                        <div class="col-md-2">
                                            <button type="button" class="btn btn-danger btn-sm" onclick="removerTelefone(this)">−</button>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <button type="button" class="btn btn-outline-primary btn-sm mt-2" onclick="adicionarTelefone(this)">+ Telefone</button>
                            <button type="button" class="btn btn-outline-danger btn-sm mt-2 ms-2" onclick="removerRepresentante(this)">− Representante</button>
                        </div>
                    </div>

                    <button type="button" class="btn btn-outline-success btn-sm" onclick="adicionarRepresentante()">+ Adicionar Representante</button>
                </fieldset>

                <!-- Botão de Salvar -->
                <div class="text-end">
                    <button type="submit" class="btn btn-success">
                        <i class="fas fa-save"></i> Salvar Equipe
                    </button>
                </div>
            </form>

        </div>
    </div>
</main>


<script>
    document.addEventListener("DOMContentLoaded", function () {
        const inputBusca = document.querySelector('input[name="buscaParticipantes"]');
        const linhasTabela = document.querySelectorAll('table tbody tr');

        inputBusca.addEventListener("input", function () {
            const termo = inputBusca.value.toLowerCase();

            linhasTabela.forEach(linha => {
                const nome = linha.querySelector("td:nth-child(2)");
                const idade = linha.querySelector("td:nth-child(3)");

                if (!nome || !idade) return; // ignora linha de "Nenhum usuário"

                const textoLinha = (nome.textContent + " " + idade.textContent).toLowerCase();
                linha.style.display = textoLinha.includes(termo) ? "" : "none";
            });
        });
    });
</script>

<script>
    function adicionarRepresentante() {
        const container = document.getElementById('representantes-container');
        const repIndex = container.children.length;

        const html = `
            <div class="border rounded p-3 mb-3 representante-block">
                <div class="mb-3">
                    <label class="form-label">Nome do Representante</label>
                    <input type="text" name="representantes[${repIndex}].nome" class="form-control" />
                </div>

                <div class="telefones-container">
                    <label class="form-label">Telefones</label>
                    <div class="row g-2 align-items-end telefone-block mb-2">
                        <div class="col-md-3">
                            <input type="text" name="representantes[${repIndex}].telefones[0].ddd" class="form-control" placeholder="DDD" />
                        </div>
                        <div class="col-md-7">
                            <input type="text" name="representantes[${repIndex}].telefones[0].numero" class="form-control" placeholder="Número" />
                        </div>
                        <div class="col-md-2">
                            <button type="button" class="btn btn-danger btn-sm" onclick="removerTelefone(this)">−</button>
                        </div>
                    </div>
                </div>

                <button type="button" class="btn btn-outline-primary btn-sm mt-2" onclick="adicionarTelefone(this)">+ Telefone</button>
            </div>
        `;
        container.insertAdjacentHTML('beforeend', html);
    }

    function adicionarTelefone(button) {
        const repBlock = button.closest('.representante-block');
        const telefonesContainer = repBlock.querySelector('.telefones-container');
        const repIndex = Array.from(document.getElementById('representantes-container').children).indexOf(repBlock);
        const telIndex = telefonesContainer.querySelectorAll('.telefone-block').length;

        const html = `
            <div class="row g-2 align-items-end telefone-block mb-2">
                <div class="col-md-3">
                    <input type="text" name="representantes[${repIndex}].telefones[${telIndex}].ddd" class="form-control" placeholder="DDD" />
                </div>
                <div class="col-md-7">
                    <input type="text" name="representantes[${repIndex}].telefones[${telIndex}].numero" class="form-control" placeholder="Número" />
                </div>
                <div class="col-md-2">
                    <button type="button" class="btn btn-danger btn-sm" onclick="removerTelefone(this)">−</button>
                </div>
            </div>
        `;
        telefonesContainer.insertAdjacentHTML('beforeend', html);
    }

    function removerTelefone(button) {
        const block = button.closest('.telefone-block');
        block.remove();
    }

    function removerRepresentante(button) {
        const card = button.closest('.representante-block');
        if (card) {
            card.remove();
        }
    }

    function removerTelefone(button) {
        const bloco = button.closest('.telefone-block');
        if (bloco) {
            bloco.remove();
        }
    }

</script>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        const adicionarForm = document.querySelector('form[action*="adicionarUsuariosParticipantes"]');
        const removerForm = document.querySelector('form[action*="removerUsuariosEquipe"]');

        adicionarForm.addEventListener("submit", function () {
            removerForm.removeAttribute("id");
            adicionarForm.setAttribute("id", "pessoasEquipe");
        });

        removerForm.addEventListener("submit", function () {
            adicionarForm.removeAttribute("id");
            removerForm.setAttribute("id", "pessoasEquipe");
        });
    });
</script>



</body>
</html>
