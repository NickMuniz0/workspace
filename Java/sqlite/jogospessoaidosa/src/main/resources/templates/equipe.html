<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Lista de Equipes</title>
    <meta charset="UTF-8"/>
    <link rel="stylesheet" th:href="@{/css/equipe.css}" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<nav th:replace="~{fragments/menu :: menu}"></nav>

<main class="container mt-5">
    <div class="card shadow">
        <!-- Cabeçalho -->
        <div class="card-header bg-info text-white d-flex justify-content-between align-items-center">
            <h2 class="mb-0"><i class="fas fa-users"></i> Equipes Cadastradas</h2>
            <div class="d-flex gap-2">
                <a th:href="@{/equipes/cadastrar2}" class="btn btn-light">
                    <i class="fas fa-plus"></i> Nova Equipe
                </a>

            </div>
        </div>

        <div class="card-body">
            <!-- Busca -->
            <form th:action="@{/equipes/buscar}" method="get" class="mb-4">
                <div class="input-group">
                    <input type="text" name="filtro" class="form-control" placeholder="Buscar por nome da equipe..." th:value="${filtro}">
                    <button type="submit" class="btn btn-outline-info">
                        <i class="fas fa-search"></i> Buscar
                    </button>
                </div>
            </form>

            <!-- Tabela de Equipes -->
            <form th:action="@{/equipes/deletarMultiplos}" method="post" id="formEquipes">
                <div class="table-responsive mb-3">
                    <table class="table table-bordered table-hover align-middle">
                        <thead class="table-light">
                        <tr>
                            <th><input type="checkbox" onclick="toggleAll(this)" /></th>
                            <th>Nome da Equipe</th>
                            <th>RPA</th>
                            <th>Representantes</th>
                            <th>Ações</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="equipe : ${equipesPage.content}">
                            <td><input type="checkbox" name="idsParaExcluir" th:value="${equipe.id}" class="checkExcluir" /></td>
                            <td th:text="${equipe.nome}"></td>
                            <td th:text="${equipe.rpa}"></td>
                            <td>
                                <div th:if="${equipe.representantes}">
                                    <ul class="list-group">
                                        <li class="list-group-item" th:each="rep : ${equipe.representantes}">
                                            <strong th:text="${rep.nome}"></strong>
                                            <div th:if="${rep.telefones}">
                                                <small class="text-muted">Telefones:</small>
                                                <ul class="list-inline ms-2">
                                                    <li class="list-inline-item" th:each="tel : ${rep.telefones}">
                                                        <span th:text="'(' + ${tel.dd} + ') ' + ${tel.numero}"></span>
                                                    </li>
                                                </ul>
                                            </div>
                                        </li>
                                    </ul>
                                </div>
                                <span th:if="${#lists.isEmpty(equipe.representantes)}" class="text-muted">Sem representantes</span>
                            </td>
                            <td>
                                <a th:href="@{/equipes/usuarios/{id}(id=${equipe.id})}" class="btn btn-outline-secondary btn-sm">
                                    <i class="fas fa-eye"></i> Ver Usuários
                                </a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(equipes)}">
                            <td colspan="6" class="text-center text-muted">Nenhuma equipe encontrada</td>
                        </tr>
                        </tbody>
                        <div class="pagination">
                            <a th:if="${equipesPage.hasPrevious()}"
                            th:href="@{/equipes(page=${equipesPage.number - 1}, size=${equipesPage.size})}">
                                <i class="fas fa-arrow-left"></i>
                            </a>

                            <span>
                                Página <span th:text="${equipesPage.number + 1}"></span> 
                                de <span th:text="${equipesPage.totalPages}"></span>
                            </span>

                            <a th:if="${equipesPage.hasNext()}"
                            th:href="@{/equipes(page=${equipesPage.number + 1}, size=${equipesPage.size})}">
                                <i class="fas fa-arrow-right"></i>
                            </a>
                        </div>
                    </table>
                </div>
                <!-- ✅ Botão de exclusão -->
                <div class="text-end">
                    <button type="submit" class="btn btn-danger" id="btnExcluir" disabled onclick="return confirmarExclusao()">
                        <i class="fas fa-trash"></i> Excluir Selecionados
                    </button>
                </div>
            </form>
        </div>
    </div>
</main>


<!-- Scripts -->
<script>
    function toggleAll(source) {
    const checkboxes = document.querySelectorAll('.checkExcluir');
    checkboxes.forEach(cb => cb.checked = source.checked);
    atualizarBotao();
}

function atualizarBotao() {
    const selecionados = document.querySelectorAll('.checkExcluir:checked');
    document.getElementById('btnExcluir').disabled = selecionados.length === 0;
}

document.querySelectorAll('.checkExcluir').forEach(cb => {
    cb.addEventListener('change', atualizarBotao);
});

function confirmarExclusao() {
    return confirm("Tem certeza que deseja excluir as pessoas selecionadas?");
}
</script>
</body>
</html>
