<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/base :: head(title='Lista de Equipes', cssFile='/css/equipe.css')}"></head>
<body>
<script th:replace="~{fragments/base :: bootstrapScripts}"></script>

<nav th:replace="~{fragments/menu :: menu}"></nav>

<main class="container mt-5">
    <div class="card shadow">
        <!-- Cabeçalho -->
        <div class="card-header bg-info text-white d-flex justify-content-between align-items-center">
            <h2 class="mb-0 d-flex align-items-center">
                <i class="fas fa-users me-2"></i>
                Equipes Cadastradas
                <span class="badge bg-light text-dark ms-3" th:text="${totalEquipes}"></span>
            </h2>
            <div class="d-flex gap-2">
                <a th:href="@{/equipes/cadastrar2}" class="btn btn-light">
                    <i class="fas fa-plus"></i> Nova Equipe
                </a>

            </div>
        </div>

        <div class="card-body">
 
            <div>
                <!-- 🔍 Formulário de busca -->
                <form th:action="@{/equipes/buscar}" method="get" class="mb-2" id="formEquipes">
                    <div class="row g-3">
                        <div class="col-md-8">
                            <div class="input-group">
                                <input type="text" name="filtro" class="form-control" placeholder="Buscar por nome da equipe..." th:value="${filtro}">
                                <button type="submit" class="btn btn-outline-primary">
                                    <i class="fas fa-search"></i> Buscar
                                </button>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <select class="form-select" name="size" id="selectSize" onchange="document.getElementById('formEquipes').submit()">
                                <option value="5" th:selected="${equipesPage.size == 5}">5</option>
                                <option value="10" th:selected="${equipesPage.size == 10}">10</option>
                                <option value="25" th:selected="${equipesPage.size == 25}">25</option>
                                <option value="50" th:selected="${equipesPage.size == 50}">50</option>
                                <option value="100" th:selected="${equipesPage.size == 100}">100</option>
                            </select>
                        </div>

                    </div>
                </form>
            </div>

            <!-- Tabela de Equipes -->
            <form th:action="@{/equipes/deletarMultiplos}" method="post" id="formEquipes">
                <div class="table-responsive mb-3" style="max-height:500px; overflow-y:auto;">
                    <table class="table table-bordered table-hover align-middle">
                        <thead class="table-light" style="position: sticky; top: 0; z-index: 2;">
                        <tr>
                            <th><input type="checkbox" onclick="toggleAll(this)" /></th>
                            <th>Nome da Equipe</th>
                            <th>RPA</th>
                            <th>Representantes</th>
                            <th>Usuários na Equipe</th>
                            <th>Participantes</th>
                            <th>Ações</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="equipe : ${equipesPage.content}">
                            <td><input type="checkbox" name="idsParaExcluir" th:value="${equipe.id}" class="checkExcluir" /></td>
                            <td th:text="${equipe.nome}"></td>
                            <td th:text="${equipe.rpa}"></td>
                            <td>
                                <div th:if="${equipe.representantes}">
                                    <ul class="list-group">
                                        <li class="list-group-item" th:each="rep : ${equipe.representantes}">
                                            <strong th:text="${rep.pessoa != null ? rep.pessoa.nome : rep.nome}"></strong>

                                            <div th:if="${rep.pessoa != null and !#lists.isEmpty(rep.pessoa.telefones)}">
                                                <small class="text-muted">Telefones:</small>
                                                <ul class="list-inline ms-2">
                                                    <li class="list-inline-item" th:each="tel : ${rep.pessoa.telefones}">
                                                        <span th:text="'(' + ${tel.dd} + ') ' + ${tel.numero}"></span>
                                                    </li>
                                                </ul>
                                            </div>
                                            <span th:if="${rep.pessoa == null or #lists.isEmpty(rep.pessoa.telefones)}" class="text-muted">Sem telefone</span>
                                        </li>
                                    </ul>
                                </div>
                                <span th:if="${#lists.isEmpty(equipe.representantes)}" class="text-muted">Sem representantes</span>
                            </td>
                            <td class="text-center" th:text="${quantidadeUsuariosNaEquipeMap != null ? quantidadeUsuariosNaEquipeMap[equipe.id] : 0}"></td>
                            <td class="text-center" th:text="${equipe.participantesJogos != null ? equipe.participantesJogos.size() : 0}"></td>
                            <td>
                                <a th:href="@{/equipes/usuarios/{id}(id=${equipe.id})}" class="btn btn-outline-secondary btn-sm">
                                    <i class="fas fa-eye"></i> Ver Usuários
                                </a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(equipes)}">
                            <td colspan="7" class="text-center text-muted">Nenhuma equipe encontrada</td>
                        </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Paginação -->
                <div class="d-flex justify-content-center mt-3">
                    <nav aria-label="Paginação da lista de equipes">
                        <ul class="pagination mb-0">

                            <!-- Primeira -->
                            <li class="page-item" th:classappend="${equipesPage.first}? ' disabled'">
                                <a class="page-link"
                                th:href="@{/equipes/buscar(page=0, size=${equipesPage.size}, filtro=${filtro})}">Primeira</a>
                            </li>

                            <!-- Anterior -->
                            <li class="page-item" th:classappend="${!equipesPage.hasPrevious()}? ' disabled'">
                                <a class="page-link"
                                th:href="@{/equipes/buscar(page=${equipesPage.number - 1}, size=${equipesPage.size}, filtro=${filtro})}">Anterior</a>
                            </li>

                            <!-- Números -->
                            <th:block th:with="start=${T(java.lang.Math).max(0, equipesPage.number - 2)},
                                            end=${T(java.lang.Math).min(equipesPage.totalPages - 1, equipesPage.number + 2)}">
                                <li class="page-item"
                                    th:each="i : ${#numbers.sequence(start, end)}"
                                    th:classappend="${i == equipesPage.number}? ' active'">
                                    <a class="page-link"
                                    th:text="${i + 1}"
                                    th:href="@{/equipes/buscar(page=${i}, size=${equipesPage.size}, filtro=${filtro})}"></a>
                                </li>
                            </th:block>

                            <!-- Próxima -->
                            <li class="page-item" th:classappend="${!equipesPage.hasNext()}? ' disabled'">
                                <a class="page-link"
                                th:href="@{/equipes/buscar(page=${equipesPage.number + 1}, size=${equipesPage.size}, filtro=${filtro})}">Próxima</a>
                            </li>

                            <!-- Última -->
                            <li class="page-item" th:classappend="${equipesPage.last}? ' disabled'">
                                <a class="page-link"
                                th:href="@{/equipes/buscar(page=${equipesPage.totalPages - 1}, size=${equipesPage.size}, filtro=${filtro})}">Última</a>
                            </li>


                        </ul>
                    </nav>
                </div>
                <!-- ✅ Botão de exclusão -->
                <div class="text-end">
                    <button type="submit" class="btn btn-danger" id="btnExcluir" disabled onclick="return confirmarExclusao()">
                        <i class="fas fa-trash"></i> Excluir Selecionados
                    </button>
                </div>
            </form>
        </div>
    </div>
</main>


<script th:replace="~{fragments/base :: bulkActionsScript}"></script>
</body>
</html>
