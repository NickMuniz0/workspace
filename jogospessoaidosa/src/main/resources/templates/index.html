<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Home - Jogos Pessoa Idosa</title>
    <meta charset="UTF-8"/>
    <link rel="stylesheet" th:href="@{/css/index.css}" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

</head>
<body>
<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<!-- Bootstrap Icons -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
<!-- Bootstrap JS (necessário para o menu responsivo funcionar) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<nav th:replace="~{fragments/menu :: menu}"></nav>

<main id="conteudo" class="home-container">
    <section class="intro">
        <h1>🎉 Bem-vindo ao Sistema de Jogos para Pessoas Idosas</h1>
        <p>Gerencie participantes, doenças e equipes de forma simples, acessível e divertida.</p>
    </section>

    <section class="actions">
        <a th:href="@{/pessoas}" class="btn btn-primary">
            <i class="fas fa-users"></i> Ver Lista de Pessoas
        </a>
        <a th:href="@{/doencas}" class="btn btn-secondary">
            <i class="fas fa-notes-medical"></i> Ver Lista de Doenças
        </a>
        <a th:href="@{/equipes}" class="btn btn-tertiary">
            <i class="fas fa-users"></i> Ver Equipes
        </a>
    </section>
</main>

</body>

</html>
