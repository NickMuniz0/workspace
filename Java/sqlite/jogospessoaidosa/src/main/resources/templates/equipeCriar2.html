<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Cadastrar Equipe</title>
    <meta charset="UTF-8"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/equipeEditar2.css}" />
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
</head>
<body>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
<nav th:replace="~{fragments/menu :: menu}"></nav>

<main class="container py-5">
    <div class="card shadow border-0 rounded-4">
        <!-- 🟢 Cabeçalho -->
        <div class="card-header bg-info text-white d-flex justify-content-between align-items-center rounded-top-4">
            <h2 class="mb-0">
                <i class="fas fa-users me-2"></i> Cadastrar Equipe
            </h2>
            <a th:href="@{/equipes}" class="btn btn-outline-light btn-sm">
                <i class="bi bi-arrow-left"></i> Voltar
            </a>
        </div>

        <!-- 📝 Formulário -->
        <div class="card-body">
            <form th:action="@{/equipes/salvarEquipe}" th:object="${equipe}" method="post" id="formSalvarEquipe" th:attr="data-equipe-id=${equipe.id != null ? equipe.id : 'new'}">
                <fieldset class="mb-4">
                    <legend class="h5 mb-3">Informações da Equipe</legend>

                    <!-- Nome -->
                    <div class="mb-3">
                        <label for="nome" class="form-label">Nome da Equipe</label>
                        <input type="text" th:field="*{nome}" id="nome" class="form-control" placeholder="Digite o nome da equipe" />
                        <div class="text-danger" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></div>
                    </div>

                    <!-- RPA -->
                    <div class="mb-3">
                        <label for="rpa" class="form-label">RPA</label>
                        <select th:field="*{rpa}" id="rpa" class="form-select">
                            <option value="" disabled selected>Selecione a RPA</option>
                            <option th:each="rpaItem : ${RPA}" th:value="${rpaItem}" th:text="${rpaItem}">RPA</option>
                        </select>
                        <div class="text-danger" th:if="${#fields.hasErrors('rpa')}" th:errors="*{rpa}"></div>
                    </div>
                    
                </fieldset>

                <!-- Representantes -->
                <fieldset class="mb-4">
                    <label for="representantes" class="form-label">Representantes</label>
                    <select th:field="*{representantesIds}" id="representantes" class="form-select" multiple="multiple">
                        <option th:each="pessoa : ${pessoasDisponiveis}"
                                th:value="${pessoa.id}"
                                th:text="${pessoa.nome}">
                        </option>
                    </select>
                </fieldset>

                <!-- Botão de envio -->
                <div class="text-end">
                    <button type="submit" class="btn btn-success">
                        <i class="fas fa-save me-1"></i> Salvar Equipe
                    </button>
                </div>
            </form>
        </div>
    </div>
</main>

<script th:inline="javascript">
    $(document).ready(function() {
                $('#representantes').select2({
                    placeholder: "Buscar e selecionar pessoas",
                    minimumInputLength: 2,
                    ajax: {
                        url: '/pessoas/search',
                        dataType: 'json',
                        delay: 250,
                        data: function (params) {
                            return { filtro: params.term };
                        },
                        processResults: function (data) {
                            return {
                                results: data.map(p => ({
                                    id: p.id,
                                    text: p.text
                                }))
                            };
                        }
                    }
                });

        // Pré-carregar os já selecionados
        let selecionados = [[${representanteIds}]];      // ex: [1,2,3]
        let nomes = [[${nomesRepresentantes}]];         // ex: ["Maria","João","Ana"]

        if (selecionados && nomes) {
            selecionados.forEach((id, index) => {
                let option = new Option(nomes[index], id, true, true);
                $('#representantes').append(option).trigger('change');
            });
        }
    });
</script>
