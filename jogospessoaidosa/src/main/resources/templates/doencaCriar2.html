<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Cadastrar Doença</title>
    <meta charset="UTF-8"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/doencaEditar2.css}" />
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>

</head>
<body>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
<nav th:replace="~{fragments/menu :: menu}"></nav>

<main class="container py-5">
    <div class="card shadow border-0 rounded-4">
        <!-- 🔷 Cabeçalho -->
        <div class="card-header bg-danger text-white d-flex justify-content-between align-items-center rounded-top-4">
            <h2 class="mb-0">
                <i class="fas fa-plus-circle me-2"></i> Cadastrar Doença
            </h2>
            <a th:href="@{/doencas}" class="btn btn-outline-light btn-sm">
                <i class="bi bi-arrow-left"></i> Voltar
            </a>
        </div>

        <!-- 📝 Formulário -->
        <div class="card-body">
            <form th:action="@{/doencas/salvarDoenca}" th:object="${doenca}" method="post">
                <fieldset>
                    <legend class="h5 mb-4">Informações da Doença</legend>

                    <div class="mb-3">
                        <label for="nome" class="form-label">Nome da Doença</label>
                        <input type="text" th:field="*{nome}" id="nome" class="form-control" placeholder="Digite o nome da doença" />
                        <div class="text-danger" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></div>
                    </div>
                </fieldset>

                <div class="text-end">
                    <button type="submit" class="btn btn-success">
                        <i class="fas fa-save me-1"></i> Salvar
                    </button>
                </div>
            </form>
        </div>
    </div>
</main>


</body>
</html>
