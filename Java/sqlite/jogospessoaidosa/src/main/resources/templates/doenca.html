<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/base :: head(title='Lista de Doenças', cssFile='/css/doenca.css')}"></head>
<body>
<script th:replace="~{fragments/base :: bootstrapScripts}"></script>

<nav th:replace="~{fragments/menu :: menu}"></nav>

<main class="container mt-5">
    <div class="card shadow">
        <!-- Cabeçalho -->
        <div class="card-header bg-danger text-white d-flex justify-content-between align-items-center">
            <h2 class="mb-0 d-flex align-items-center">
                <i class="fas fa-virus me-2"></i>
                Lista de Doenças
                <span class="badge bg-light text-dark ms-3" th:text="${totalDoencas}"></span>
            </h2>
            <div class="d-flex gap-2">
                <a th:href="@{/doencas/cadastrar2}" class="btn btn-light">
                    <i class="fas fa-plus-circle"></i> Nova Doença
                </a>
            </div>
        </div>

        <div class="card-body">
            <!-- Formulário de busca -->
            <form th:action="@{/doencas/buscar}" method="get" class="mb-4" id="formBusca">
                <div class="row g-3">
                    <div class="col-md-8">
                        <div class="input-group">
                            <input type="text" name="filtro" class="form-control" placeholder="Buscar por nome da doença..." th:value="${filtro}">
                            <button type="submit" class="btn btn-outline-danger">
                                <i class="fas fa-search"></i> Buscar
                            </button>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <select class="form-select" name="size" id="selectSize" onchange="document.getElementById('formBusca').submit()">
                            <option value="5" th:selected="${doencasPage.size == 5}">5</option>
                            <option value="10" th:selected="${doencasPage.size == 10}">10</option>
                            <option value="25" th:selected="${doencasPage.size == 25}">25</option>
                            <option value="50" th:selected="${doencasPage.size == 50}">50</option>
                            <option value="100" th:selected="${doencasPage.size == 100}">100</option>
                        </select>
                    </div>
                </div>
            </form>

            <!-- Formulário de exclusão múltipla -->
            <form th:action="@{/doencas/deletarMultiplos}" method="post" id="formDoencas">
                <div class="table-responsive-scroll">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                        <tr>
                            <th><input type="checkbox" onclick="toggleAll(this)" /></th>
                            <th>Nome</th>
                            <th>Ações</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="doenca : ${doencasPage.content}">
                            <td><input type="checkbox" name="idsParaExcluir" th:value="${doenca.id}" class="checkExcluir" /></td>
                            <td th:text="${doenca.nome}"></td>
                            <td>
                                <a th:href="@{/doencas/edit2/{id}(id=${doenca.id})}" class="btn btn-outline-primary btn-sm me-2">
                                    <i class="fas fa-edit"></i> Editar
                                </a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(doencas)}">
                            <td colspan="4" class="text-center text-muted">Nenhuma doença encontrada</td>
                        </tr>
                        </tbody>
                    </table>
                </div>

            <!-- Paginação -->
                <div class="d-flex justify-content-center mt-3">
                    <nav aria-label="Paginação da lista de doencas">
                        <ul class="pagination mb-0">

                            <!-- Primeira -->
                            <li class="page-item" th:classappend="${doencasPage.first}? ' disabled'">
                                <a class="page-link"
                                th:href="@{/doencas/buscar(page=0, size=${doencasPage.size}, filtro=${filtro})}">Primeira</a>
                            </li>

                            <!-- Anterior -->
                            <li class="page-item" th:classappend="${!doencasPage.hasPrevious()}? ' disabled'">
                                <a class="page-link"
                                th:href="@{/doencas/buscar(page=${doencasPage.number - 1}, size=${doencasPage.size}, filtro=${filtro})}">Anterior</a>
                            </li>

                            <!-- Números -->
                            <th:block th:with="start=${T(java.lang.Math).max(0, doencasPage.number - 2)},
                                            end=${T(java.lang.Math).min(doencasPage.totalPages - 1, doencasPage.number + 2)}">
                                <li class="page-item"
                                    th:each="i : ${#numbers.sequence(start, end)}"
                                    th:classappend="${i == doencasPage.number}? ' active'">
                                    <a class="page-link"
                                    th:text="${i + 1}"
                                    th:href="@{/doencas/buscar(page=${i}, size=${doencasPage.size}, filtro=${filtro})}"></a>
                                </li>
                            </th:block>

                            <!-- Próxima -->
                            <li class="page-item" th:classappend="${!doencasPage.hasNext()}? ' disabled'">
                                <a class="page-link"
                                th:href="@{/doencas/buscar(page=${doencasPage.number + 1}, size=${doencasPage.size}, filtro=${filtro})}">Próxima</a>
                            </li>

                            <!-- Última -->
                            <li class="page-item" th:classappend="${doencasPage.last}? ' disabled'">
                                <a class="page-link"
                                th:href="@{/doencas/buscar(page=${doencasPage.totalPages - 1}, size=${doencasPage.size}, filtro=${filtro})}">Última</a>
                            </li>


                        </ul>
                    </nav>
                </div>

                <!-- ✅ Botão de exclusão -->
                <div class="text-end">
                    <button type="submit" class="btn btn-danger" id="btnExcluir" disabled onclick="return confirmarExclusao()">
                        <i class="fas fa-trash"></i> Excluir Selecionados
                    </button>
                </div>
            </form>
        </div>
    </div>
</main>



<script th:replace="~{fragments/base :: bulkActionsScript}"></script>
</body>
</html>
