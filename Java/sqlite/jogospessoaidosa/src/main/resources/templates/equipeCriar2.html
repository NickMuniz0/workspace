<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Cadastrar Equipe</title>
    <meta charset="UTF-8"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/equipeEditar2.css}" />
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
<nav th:replace="~{fragments/menu :: menu}"></nav>

<main class="container py-5">
    <div class="card shadow border-0 rounded-4">
        <!-- 🟢 Cabeçalho -->
        <div class="card-header bg-info text-white d-flex justify-content-between align-items-center rounded-top-4">
            <h2 class="mb-0">
                <i class="fas fa-users me-2"></i> Cadastrar Equipe
            </h2>
            <a th:href="@{/equipes}" class="btn btn-outline-light btn-sm">
                <i class="bi bi-arrow-left"></i> Voltar
            </a>
        </div>

        <!-- 📝 Formulário -->
        <div class="card-body">
            <form th:action="@{/equipes/salvarEquipe}" th:object="${equipe}" method="post">
                <fieldset class="mb-4">
                    <legend class="h5 mb-3">Informações da Equipe</legend>

                    <!-- Nome -->
                    <div class="mb-3">
                        <label for="nome" class="form-label">Nome da Equipe</label>
                        <input type="text" th:field="*{nome}" id="nome" class="form-control" placeholder="Digite o nome da equipe" />
                        <div class="text-danger" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></div>
                    </div>

                    <!-- RPA -->
                    <div class="mb-3">
                        <label for="rpa" class="form-label">RPA</label>
                        <select th:field="*{rpa}" id="rpa" class="form-select">
                            <option value="" disabled selected>Selecione a RPA</option>
                            <option th:each="rpaItem : ${RPA}" th:value="${rpaItem}" th:text="${rpaItem}">RPA</option>
                        </select>
                        <div class="text-danger" th:if="${#fields.hasErrors('rpa')}" th:errors="*{rpa}"></div>
                    </div>
                </fieldset>

                <!-- 👥 Representantes -->
                <fieldset class="mb-4">
                    <legend class="h5 mb-3">Representantes</legend>
                    <div id="representantes-container">
                        <div th:each="rep, repStat : *{representantes}" class="representante-block border rounded p-3 mb-3">
                            <label class="form-label">Nome do Representante</label>
                            <input type="text" th:field="*{representantes[__${repStat.index}__].nome}" class="form-control mb-3" placeholder="Nome do representante" />

                            <!-- Telefones -->
                            <label class="form-label">Telefones</label>
                            <div class="telefones-container">
                                <div th:each="tel, telStat : *{representantes[__${repStat.index}__].telefones}" class="telefone-block mb-2">
                                    <div class="row g-2">
                                        <div class="col-md-3">
                                            <input type="text" th:field="*{representantes[__${repStat.index}__].telefones[__${telStat.index}__].dd}" class="form-control" placeholder="DDD" />
                                        </div>
                                        <div class="col-md-7">
                                            <input type="text" th:field="*{representantes[__${repStat.index}__].telefones[__${telStat.index}__].numero}" class="form-control" placeholder="Número" />
                                        </div>
                                        <div class="col-md-2 d-grid">
                                            <button type="button" class="btn btn-danger btn-sm" onclick="removerTelefone(this)">−</button>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Ações -->
                            <div class="mt-3">
                                <button type="button" class="btn btn-outline-primary btn-sm" onclick="adicionarTelefone(this)">
                                    <i class="bi bi-plus-circle"></i> Telefone
                                </button>
                                <button type="button" class="btn btn-outline-danger btn-sm ms-2" onclick="removerRepresentante(this)">
                                    <i class="bi bi-dash-circle"></i> Representante
                                </button>
                            </div>
                        </div>
                    </div>

                    <button type="button" class="btn btn-outline-success btn-sm" onclick="adicionarRepresentante()">
                        <i class="bi bi-plus-circle"></i> Adicionar Representante
                    </button>
                </fieldset>

                <!-- Botão de envio -->
                <div class="text-end">
                    <button type="submit" class="btn btn-success">
                        <i class="fas fa-save me-1"></i> Salvar Equipe
                    </button>
                </div>
            </form>
        </div>
    </div>
</main>

<script>
    function adicionarRepresentante() {
    const container = document.getElementById('representantes-container');
    const repIndex = container.children.length;

    const representanteHTML = `
        <div class="representante-block border p-3 mb-3">
            <label>Nome do Representante</label>
            <input type="text" name="representantes[${repIndex}].nome" class="form-control mb-2" placeholder="Nome do representante" />

            <div class="telefones-container">
                <label>Telefones</label>
                <div class="telefone-block mb-2">
                    <div class="row">
                        <div class="col-md-3">
                            <input type="text" name="representantes[${repIndex}].telefones[0].dd" class="form-control" placeholder="DDD" />
                        </div>
                        <div class="col-md-7">
                            <input type="text" name="representantes[${repIndex}].telefones[0].numero" class="form-control" placeholder="Número" />
                        </div>
                        <div class="col-md-2">
                            <button type="button" class="btn btn-danger btn-sm" onclick="removerTelefone(this)">−</button>
                        </div>
                    </div>
                </div>
            </div>

            <button type="button" class="btn btn-outline-primary btn-sm mt-2" onclick="adicionarTelefone(this)">+ Telefone</button>
            <button type="button" class="btn btn-outline-danger btn-sm mt-2 ms-2" onclick="removerRepresentante(this)">− Representante</button>
        </div>
    `;
    container.insertAdjacentHTML('beforeend', representanteHTML);
}

function adicionarTelefone(button) {
    const representanteBlock = button.closest('.representante-block');
    const telefonesContainer = representanteBlock.querySelector('.telefones-container');
    const repIndex = Array.from(document.getElementById('representantes-container').children).indexOf(representanteBlock);
    const telIndex = telefonesContainer.querySelectorAll('.telefone-block').length;

    const telefoneHTML = `
        <div class="telefone-block mb-2">
            <div class="row">
                <div class="col-md-3">
                    <input type="text" name="representantes[${repIndex}].telefones[${telIndex}].dd" class="form-control" placeholder="DDD" />
                </div>
                <div class="col-md-7">
                    <input type="text" name="representantes[${repIndex}].telefones[${telIndex}].numero" class="form-control" placeholder="Número" />
                </div>
                <div class="col-md-2">
                    <button type="button" class="btn btn-danger btn-sm" onclick="removerTelefone(this)">−</button>
                </div>
            </div>
        </div>
    `;
    telefonesContainer.insertAdjacentHTML('beforeend', telefoneHTML);
}

    function removerTelefone(button) {
        button.closest('.telefone-block').remove();
    }

    function removerRepresentante(button) {
        button.closest('.representante-block').remove();
    }
</script>


<script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</body>
</html>
